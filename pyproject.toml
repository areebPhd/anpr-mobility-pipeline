[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anpr-mobility-pipeline"
version = "0.1.0"
description = "Auditable construction of analytical mobility records from ANPR observations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Areeb Alshoshan"}]
dependencies = ["duckdb>=1.0", "pandas>=2.0", "pyarrow>=12", "PyYAML>=6", "charset-normalizer>=3"]

[project.optional-dependencies]
test = ["pytest>=8"]
geo = ["osmnx==2.0.6", "geopandas==1.1.4", "shapely==2.1.2", "pyproj==3.7.1", "networkx==3.4.2", "pyogrio>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.urls]
Repository = "https://github.com/areebPhd/anpr-mobility-pipeline"
Issues = "https://github.com/areebPhd/anpr-mobility-pipeline/issues"
